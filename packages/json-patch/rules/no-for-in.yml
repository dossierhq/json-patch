id: no-for-in
message: |
  `for…in` walks inherited enumerable members too: iterate `Object.keys` / `Object.entries`.
note: |
  A `for…in` over a JSON object visits whatever `Object.prototype` has been given as an
  enumerable member — a polluted prototype turns into document members. The own-key
  iterators never look past the object.
severity: error
language: Tsx
files:
  - "src/**"
rule:
  kind: for_in_statement
  has:
    field: operator
    regex: "^in$"
