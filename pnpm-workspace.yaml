packages:
  - packages/*

allowBuilds:
  "@ast-grep/cli": true
  esbuild: true

blockExoticSubdeps: true

# 7d in minutes
minimumReleaseAge: 10080
# strict mode breaks Dependabot's `pnpm update --no-save`; remove once dependabot/dependabot-core#16375 is fixed
minimumReleaseAgeStrict: false
# if a security fix is younger than minimumReleaseAge, pin the exact version via
# overrides rather than adding a minimumReleaseAgeExclude entry here — excluding a
# whole dependency disables the safeguard for all its future versions. If an entry
# is unavoidable, drop it again once that version ages past the 7d window.
minimumReleaseAgeExclude:
  # the exact fast-uri pin in overrides below; pnpm wrote this itself. Drop with
  # that pin after 2026-10-27
  - fast-uri@3.1.9

onlyBuiltDependencies: []

overrides:
  # GHSA-x5fp-wj9c-mxmx et al.; typed-rest-client 2.3 (via @stryker-mutator/core)
  # pins qs 6.15.1 exactly
  "qs@6.15.1": ~6.16.1
  # GHSA-w74x-v6f9-j3xg et al. (ajv via @stryker-mutator/core); pinned exact while
  # younger than minimumReleaseAge, drop after 2026-10-27 once it ages past the window
  "fast-uri@3.1.8": 3.1.9

updateNotifier: false
# vitest-runner 10.0.0 joins a suite chain and its test name with a space, where Vitest 5
# matches `testNamePattern` against them joined with " > ", so unpatched no nested test
# runs against its mutant and every one of them survives (stryker-mutator/stryker-js#6210).
# Drop the patch with the vitest-runner release that fixes it; pnpm refuses to install
# until then anyway, since the patch names this exact version.
patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
