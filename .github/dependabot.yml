version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    groups:
      oxlint:
        patterns:
          - "oxlint"
          - "oxlint-*"
      stryker:
        patterns:
          - "@stryker-mutator/*"
      turbo:
        patterns:
          - "eslint-plugin-turbo"
          - "turbo"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
