name: Dependency Maintenance

on:
  schedule:
    # Run pnpm dedupe daily at 3 AM UTC
    - cron: "0 3 * * *"
    # Run mise tool updates weekly on Tuesday at 3 AM UTC
    - cron: "0 3 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pnpm-dedupe:
    name: pnpm dedupe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push branch with deduped pnpm-lock.yaml
      pull-requests: write # open the dedupe PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          minimum_release_age: 7d

      - name: Set up pnpm global bin directory
        run: |
          PNPM_HOME=/home/runner/.local/share/pnpm
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          UV_FROZEN: "1"

      - name: Run pnpm dedupe
        run: pnpm dedupe

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(deps): Deduplicate pnpm lockfile"
          title: "chore(deps): Deduplicate pnpm lockfile"
          body: |
            This automated PR deduplicates dependencies in the pnpm lockfile.

            Running `pnpm dedupe` optimizes the lockfile by removing duplicate packages and can reduce installation time and disk space usage.

            Please review the changes and merge if CI passes.
          branch: automated/pnpm-dedupe
          delete-branch: true
          labels: dependencies

  mise-tool-updates:
    name: mise tool updates
    runs-on: ubuntu-latest
    # Only run weekly on Tuesday at 3 AM UTC
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 2')
    timeout-minutes: 10
    permissions:
      contents: write # push branch with updated mise.toml/.nvmrc/package.json/pnpm-lock.yaml
      pull-requests: write # open the tool-update PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          minimum_release_age: 7d

      - name: Update mise tools
        run: mise up --bump

      - name: Sync pnpm version in package.json
        run: |
          PNPM_VERSION=$(grep "^pnpm = " mise.toml | sed 's/pnpm = "\(.*\)"/\1/')
          if [ -n "$PNPM_VERSION" ]; then
            jq --arg version "pnpm@$PNPM_VERSION" '.packageManager = $version' package.json > package.json.tmp
            mv package.json.tmp package.json
            echo "Updated packageManager to pnpm@$PNPM_VERSION"
          fi

      - name: Sync Node version in .nvmrc
        run: |
          NODE_VERSION=$(grep "^node = " mise.toml | sed 's/node = "\(.*\)"/\1/')
          if [ -n "$NODE_VERSION" ]; then
            echo "$NODE_VERSION" > .nvmrc
            echo "Updated .nvmrc to $NODE_VERSION"
          fi

      # pnpm records its own version under packageManagerDependencies in
      # pnpm-lock.yaml, so a pnpm bump without this leaves the lockfile stale.
      # mise exec picks up the freshly bumped version rather than the one
      # mise-action put on PATH before the bump.
      - name: Update pnpm lockfile
        run: mise exec -- pnpm install --lockfile-only

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(tools): Update tool versions"
          title: "chore(tools): Update tool versions"
          body: |
            This automated PR updates tool versions in `mise.toml` using `mise up --bump`.

            Please review the changes and merge if CI passes.
          branch: automated/mise-tool-updates
          delete-branch: true
          labels: dependencies
