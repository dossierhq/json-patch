name: CI
# pull_request as well as push: the "Version Packages" PR that changesets/action
# opens is pushed with GITHUB_TOKEN, and GitHub does not fire push workflows for
# those commits. Push is limited to main so human PRs do not run twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  turbo:
    name: Build
    # `ci:build` caps turbo at --concurrency=2 so a cold cache (any lockfile bump)
    # does not put every task on the runner's cores at once and stretch the
    # CPU-bound property tests past their timeouts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the fallow audit step gates on the diff against the
          # merge-base with origin/main, which a shallow checkout can't compute.
          # This checkout runs with credentials and already provides that ref;
          # a later manual `git fetch` would not, since persist-credentials is
          # false on this private repo.
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          minimum_release_age: 7d
      - name: pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm config set store-dir .pnpm-store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, lint, type-check, test
        id: build
        run: pnpm run ci:build

      # fallow runs here rather than in its own job: its per-function CRAP
      # scores read the Istanbul coverage map (health.coverage in
      # .fallowrc.json) that the package's `test` task writes in ci:build. A
      # separate job would miss the remote cache and re-run the suite for a few
      # seconds of fallow.
      #
      # ci:build runs with --continue, so the tests can have produced the map
      # even when another task failed; fallow still reports then. Without the
      # file every fallow command fails with the same "missing coverage" error,
      # so the check below gates them all and the real failure isn't buried.
      #
      # A cache hit restores whatever root produced the entry, and an Istanbul
      # map keys files by path — so a map from another checkout matches nothing
      # here, which fallow reports in a note and then scores every function by
      # its pessimistic static estimate. Silent, and it changes what the audit
      # below gates on, so it is checked rather than trusted.
      - name: Coverage map matches this checkout
        id: coverage
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: pnpm check-coverage-map

      # Two complementary complexity gates plus the two zero-tolerance ones.
      #
      # 1. Diff-scoped audit: blocks complexity/dead-code/duplication the change
      #    INTRODUCES.
      - name: Fallow audit (gate on newly-introduced findings)
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: pnpm fallow audit --base origin/main
      # 2. Aggregate health score: a floor against SYSTEMIC decay that no single
      #    function can move.
      - name: Fallow health score (gate below 85)
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: pnpm fallow health --min-score 85
      # 3 + 4. Dead code and duplication are at zero repo-wide, so they gate on
      #    ANY finding anywhere (stricter than the diff-scoped audit — catches a
      #    file that goes dead because of a change elsewhere). Separate steps
      #    that each run on a failure of the others, so one class of finding
      #    never masks another; the job still fails if any step does.
      - name: Fallow dead-code (gate on any finding)
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: pnpm fallow dead-code
      - name: Fallow duplication (gate on any finding)
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: pnpm fallow dupes

      - name: Upload turbo trace
        if: always()
        continue-on-error: true # tolerate artefact storage quota exhaustion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-trace
          path: |
            .turbo/runs/*.json
            .turbo/profile.json
          if-no-files-found: warn
          retention-days: 14
